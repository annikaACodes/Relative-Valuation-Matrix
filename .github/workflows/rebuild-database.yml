name: Rebuild SQLite database

on:
  push:
    branches: [main]
    paths:
      - "data/*.csv"
      - "database/schema.sql"
      - "scripts/build_database.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Rebuild and validate SQLite
        run: python scripts/build_database.py

      - name: Commit generated database when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/relative_valuation.sqlite
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild SQLite database"
            git push
          fi
