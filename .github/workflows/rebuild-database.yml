name: Rebuild SQLite database

on:
  push:
    branches: [main]
    paths:
      - "data/*.csv"
      - "database/schema.sql"
      - "scripts/*.py"
      - "scripts/*.mjs"
      - ".github/workflows/rebuild-database.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Calendarize fiscal forecasts
        run: node scripts/calendarize_forecasts.mjs

      - name: Rebuild and validate SQLite
        run: python scripts/build_database.py

      - name: Smoke-test ticker lookup
        run: |
          python scripts/query_database.py NVDA
          python scripts/query_database.py 2330.TW --datapoint market_cap_usd_bn
          python scripts/query_database.py SKHY
          python scripts/query_database.py KXIAY
          python scripts/query_database.py NVDA --datapoint cy2027_pe
          python scripts/query_database.py TSM --datapoint cy2028_eps

      - name: Commit generated database when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/relative_valuation.sqlite data/calendarized_metrics.csv data/semiconductor_universe.csv
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild SQLite database"
            git push
          fi
