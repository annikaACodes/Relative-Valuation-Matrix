name: Weekly market data refresh

on:
  schedule:
    - cron: "0 0 * * 0"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test updater parsers
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Refresh quotes and fiscal consensus
        run: python scripts/update_market_data.py

      - name: Calendarize fiscal forecasts
        run: node scripts/calendarize_forecasts.mjs

      - name: Rebuild and validate SQLite
        run: python scripts/build_database.py

      - name: Smoke-test refreshed values
        run: |
          python scripts/query_database.py NVDA --datapoint market_cap_usd_bn
          python scripts/query_database.py TSM --datapoint cy2028_eps_usd
          python scripts/query_database.py ASML --datapoint cy2027_ev_to_fcf

      - name: Commit successful refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fiscal_forecasts.csv data/valuation_inputs.csv data/fx_rates.csv
          git add data/calendarized_metrics.csv data/semiconductor_universe.csv
          git add data/relative_valuation.sqlite data/update_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly market data $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          else
            echo "No market-data changes to commit."
          fi
